<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>CentiCopia</title>
  </head>

  <body>
    <div id="app">
      <header class="app-header">
        <div>
          <h1>CentiCopia</h1>
          <p>Your finances. Your data. Your control.</p>
        </div>
        <span class="storage-badge">Local Database</span>
      </header>

      <button
        id="menu-toggle"
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="view-menu"
      >
        ☰ Menu
      </button>

      <nav id="view-menu" class="view-menu" aria-label="Sections">
        <button type="button" class="view-tab is-active" data-view="accounts">
          Accounts
        </button>
        <button type="button" class="view-tab" data-view="parties">
          Parties
        </button>
      </nav>

      <main class="dashboard" id="view-accounts">
        <section class="panel" aria-labelledby="add-title">
          <h2 id="add-title">Add Account</h2>

          <form id="account-form">
            <label for="account-name"> Account Name </label>
            <input
              id="account-name"
              name="name"
              type="text"
              maxlength="100"
              placeholder="e.g. Main Checking"
              autocomplete="off"
              required
            />

            <label for="account-type"> Account Type </label>
            <select id="account-type" name="type">
              <option value="checking">Checking</option>
              <option value="savings">Savings</option>
              <option value="cash">Cash</option>
              <option value="gift_card">Gift Card</option>
              <option value="credit_card">Credit Card</option>
              <option value="loan">Loan</option>
              <option value="other">Other</option>
            </select>
            <label for="opening-balance">Opening Balance (optional)</label>
            <input
              id="opening-balance"
              name="openingBalance"
              type="text"
              inputmode="decimal"
              placeholder="0.00"
              autocomplete="off"
            />

            <label for="opening-date">Opening Date</label>
            <input id="opening-date" name="openingDate" type="date" required />

            <button id="add-button" type="submit" disabled>Add Account</button>
          </form>
        </section>

        <section class="panel" aria-labelledby="accounts-title">
          <div class="section-heading">
            <h2 id="accounts-title">Accounts</h2>
            <button
              id="refresh-button"
              type="button"
              class="secondary-button"
              disabled
            >
              Refresh
            </button>
          </div>

          <p id="account-count">Loading accounts...</p>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input id="show-inactive" type="checkbox" />
              Show hidden
            </label>
            <label class="checkbox-label">
              <input id="show-archived" type="checkbox" />
              Show archived
            </label>
            <label class="checkbox-label">
              <input id="show-admin" type="checkbox" />
              Show Administrative Accounts
            </label>
          </div>
          <p id="net-worth" class="net-worth"></p>
          <ul id="account-list" class="account-list"></ul>
        </section>
      </main>

      <div id="view-parties" class="dashboard" hidden>
        <section class="panel" aria-labelledby="add-party-title">
          <h2 id="add-party-title">Add Party</h2>
          <form id="party-form">
            <label for="party-name">Party Name</label>
            <input
              id="party-name"
              name="name"
              type="text"
              maxlength="100"
              required
            />
            <label for="party-phone">Phone (optional)</label>
            <input id="party-phone" name="phone" type="tel" />
            <label for="party-email">Email (optional)</label>
            <input id="party-email" name="email" type="email" />
            <label for="party-address">Address (optional)</label>
            <input id="party-address" name="address" type="text" />
            <button id="add-party-button" type="submit" disabled>
              Add Party
            </button>
          </form>
        </section>

        <section class="panel" aria-labelledby="parties-title">
          <div class="section-heading">
            <h2 id="parties-title">Parties</h2>
            <button
              id="refresh-parties-button"
              type="button"
              class="secondary-button"
              disabled
            >
              Refresh
            </button>
          </div>
          <p id="party-count">Loading parties...</p>
          <ul id="party-list" class="account-list"></ul>
        </section>
      </div>

      <footer class="app-footer">
        <p id="status" role="status" aria-live="polite">
          Initializing database...
        </p>
        <small id="database-info"></small>
        <button
          id="reset-button"
          type="button"
          class="secondary-button"
          disabled
        >
          Reset all data
        </button>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
